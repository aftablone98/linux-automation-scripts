name: Bash Scripts CI

ion:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-bash-scripts:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Install ShellCheck
      # ==========================================
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # ==========================================
      # ShellCheck Bash Scripts
      # ==========================================
      - name: Run ShellCheck
        run: |
          find scripts -type f -name "*.sh" -print0 | xargs -0 shellcheck

      # ==========================================
      # Bash Syntax Check
      # ==========================================
      - name: Check Bash syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      # ==========================================
      # Make Scripts Executable
      # ==========================================
      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      # ==========================================
      # Test Health Check
      # ==========================================


            - name: Run health check
        run: |
          set +e

          ./scripts/health_check.sh

          STATUS=$?

          echo "Health check exit code: $STATUS"

          if [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 2 ]; then
            echo "Health check executed successfully."
            exit 0
          else
            echo "Health check failed unexpectedly."
            exit "$STATUS"
          fi



    set +e

    ./scripts/health_check.sh

    STATUS=$?

    echo "Health check exit code: $STATUS"

    if [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 2 ]; then
      echo "Health check executed successfully."
      exit 0
    else
      echo "Health check failed unexpectedly."
      exit "$STATUS"
    fi

      # ==========================================
      # Test Health Check Help
      # ==========================================
      - name: Test invalid threshold
  run: |
    if ./scripts/health_check.sh --cpu abc; then
      echo "ERROR: Invalid threshold was accepted"
      exit 1
    else
      echo "Invalid threshold correctly rejected"
    fi
