name: Bash Scripts CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-bash-scripts:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Install ShellCheck
      # ==========================================
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # ==========================================
      # Run ShellCheck
      # ==========================================
      - name: Run ShellCheck
        run: |
          find scripts -type f -name "*.sh" -print0 | xargs -0 shellcheck

      # ==========================================
      # Check Bash Syntax
      # ==========================================
      - name: Check Bash syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      # ==========================================
      # Make Scripts Executable
      # ==========================================
      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      # ==========================================
      # Run Health Check
      # ==========================================
      - name: Run health check
        run: |
          set +e

          ./scripts/health_check.sh

          STATUS=$?

          echo "Health check exit code: $STATUS"

          if [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 1 ] || [ "$STATUS" -eq 2 ]; then
            echo "Health check executed successfully."
            exit 0
          else
            echo "Health check failed unexpectedly."
            exit "$STATUS"
          fi

      # ==========================================
      # Test Health Check Help
      # ==========================================
      - name: Test health check help
        run: |
          ./scripts/health_check.sh --help

      # ==========================================
      # Test Invalid CPU Threshold
      # ==========================================
      - name: Test invalid CPU threshold
        run: |
          if ./scripts/health_check.sh --cpu abc; then
            echo "ERROR: Invalid CPU threshold was accepted."
            exit 1
          else
            echo "Invalid CPU threshold correctly rejected."
          fi

      # ==========================================
      # Test Invalid Memory Threshold
      # ==========================================
      - name: Test invalid memory threshold
        run: |
          if ./scripts/health_check.sh --memory abc; then
            echo "ERROR: Invalid memory threshold was accepted."
            exit 1
          else
            echo "Invalid memory threshold correctly rejected."
          fi

      # ==========================================
      # Test Invalid Disk Threshold
      # ==========================================
      - name: Test invalid disk threshold
        run: |
          if ./scripts/health_check.sh --disk abc; then
            echo "ERROR: Invalid disk threshold was accepted."
            exit 1
          else
            echo "Invalid disk threshold correctly rejected."
          fi